<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Reading</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1>Edit Air Quality Reading</h1>
</header>

<div class="container">

<input type="text" id="locality" placeholder="Locality"><br><br>

<input type="number" id="pm" placeholder="PM Value"><br><br>

<select id="level">
<option>Good</option>
<option>Moderate</option>
<option>Poor</option>
<option>Hazardous</option>
</select>

<br><br>

<input type="text" id="device" placeholder="Device ID"><br><br>

<button onclick="updateReading()">Update</button>

<a href="index.html">
<button>Back</button>
</a>

</div>
<script src="js/utils.js"></script>
<script src="js/validation.js"></script>
<script src="js/edit.js"></script>

</body>
</html>
